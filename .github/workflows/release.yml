name: Release

# Publishes the version in package.json to npm and tags it.
# - Push a v* tag yourself, or
# - run it by hand (workflow_dispatch) on main: it tags the current
#   package.json version, then publishes. A tag pushed with the workflow's own
#   token does not start this workflow again, so nothing publishes twice.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Tag the package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run the release from main."; exit 1; }
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump the version first."
            exit 1
          fi
          if npm view "$(node -p "require('./package.json').name")@$version" version >/dev/null 2>&1; then
            echo "::error::$version is already on npm."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag at $GITHUB_SHA"

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
